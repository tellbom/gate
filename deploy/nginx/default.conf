server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Other API reverse-proxy locations can be mounted here without placing
    # RBAC back in the Nginx request path.
    include /etc/nginx/server-locations/*.conf;
}
